<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking Form</title>
    <style>
        body{
            margin: 10px 10px;
            padding: 20px 20px;
        }
    </style>
</head>

<body>
    <fieldset>
        <legend>Hotel Booking Form</legend>
        

        <form>

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="John Doe">

            <br><br>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="johnn@example.com">

            <br><br>

            <label for="phone">Phone</label>
            <input type="tel" id="phone" placeholder="918009080040">

            <br><br>

            <label for="checkin">Check-In Date</label>
            <input type="date" id="checkin">

            <br><br>

            <label for="checkout">Check-Out Date</label>
            <input type="date" id="checkout">

            <br><br>

            <label for="room">Room Type</label>
            <select id="room">
                <option>Single Room</option>
                <option>Double Room</option>
                <option>Deluxe Room</option>
                <option>Suite</option>
            </select>

            <br><br>

            <label for="guests">Total Guest Count</label>
            <input type="number" id="guests" value="1">

            <br><br>

            <label for="request">Special Request</label>
            <br>
            <textarea id="request" rows="7" cols="30"></textarea>

            <br><br>

            <input type="checkbox" id="terms" checked>
            <label for="terms">Terms and Conditions</label>

            <br><br>

            <button type="submit">Book Now</button>
            <button type="reset">Reset Form</button>

        </form>
    </fieldset>
</body>
</html>
